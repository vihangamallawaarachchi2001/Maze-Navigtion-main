# Nav2 parameters for the IE4060 maze (ROS 2 Jazzy, nav2 1.3.x installed via RoboStack).
# Derived from the installed nav2_bringup/params/nav2_params.yaml. Project changes:
#  * robot_base_frame base_footprint (verified live frame), scan topic /scan
#  * circular footprint r = 0.13 m = circumscribed radius of the true Burger outline + 6 mm (conservative)
#  * costmap resolution 0.025 m = SLAM map resolution
#  * planner: NavfnPlanner, use_astar=false  -> Dijkstra baseline (documented in docs/architecture.md)
#  * controller: RegulatedPurePursuitController (MPPI from the stock file is too CPU-heavy for the VM);
#    the SAME controller executes Dijkstra paths (NavigateToPose) and DQN paths (FollowPath)
#  * limits = Burger limits (0.22 m/s, 2.84 rad/s) further capped for the 0.45 m corridors
#  * enable_stamped_cmd_vel false: installed default is false (nav2_util/twist_publisher.hpp) and the
#    ros_gz bridge expects geometry_msgs/msg/Twist
amcl:
  ros__parameters:
    use_sim_time: true
    alpha1: 0.05   # (project change) odometry is accurate
    alpha2: 0.05   # (project change) odometry is accurate
    alpha3: 0.05   # (project change) odometry is accurate
    alpha4: 0.05   # (project change) odometry is accurate
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 0.5   # (project change)
    laser_max_range: 3.5
    laser_min_range: 0.12
    laser_model_type: "likelihood_field"
    max_beams: 120   # (project change)
    max_particles: 1500
    min_particles: 300
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.1   # (project change)
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.15
    update_min_d: 0.05   # (project change)
    z_hit: 0.8   # (project change)
    z_max: 0.05
    z_rand: 0.2   # (project change)
    z_short: 0.05
    scan_topic: scan
    # The SLAM map frame coincides with the Gazebo world frame (docs/map_provenance.md), so after a
    # fresh start the robot is at the safe spawn pose (config/safe_spawn.yaml) in map coordinates.
    set_initial_pose: true
    initial_pose: {x: -1.25, y: -1.25, z: 0.0, yaw: 0.0}

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 2000   # ms; stock 20 ms timed out on the loaded VM (project change)
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    controller_frequency: 10.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0   # (project change)
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.15
      movement_time_allowance: 15.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.08
      yaw_goal_tolerance: 0.30
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.18
      lookahead_dist: 0.10   # (project change) pure-pursuit cut ~ L^2/2R: short lookahead for 0.45 m corridors
      min_lookahead_dist: 0.08
      max_lookahead_dist: 0.15
      lookahead_time: 1.5
      rotate_to_heading_angular_vel: 1.2
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.4
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 0.25   # (project change) only imminent contact; longer horizons flagged corner geometry the path never crosses
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9   # (project change) slow down on tight curves
      regulated_linear_scaling_min_speed: 0.06
      use_fixed_curvature_lookahead: false
      curvature_lookahead_dist: 0.4
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 0.25   # (project change) pivot at 90-degree corners
      max_angular_accel: 3.0
      max_robot_pose_search_dist: 10.0
      interpolate_curvature_after_goal: false
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 2
      height: 2
      resolution: 0.025
      # local costmap (RPP collision checking): TRUE Burger outline (base box x -0.102..0.038, wheels
      # |y|<=0.089, ~3 mm margin) so only real contact is predicted. The global costmap uses the
      # conservative circumscribed circle for planning (docs/architecture.md).
      footprint: "[[0.040, 0.090], [0.040, -0.090], [-0.105, -0.090], [-0.105, 0.090]]"
      footprint_padding: 0.0
      # stock-style local costmap: live LiDAR only (a static layer here, shifted by AMCL error,
      # narrowed the corridors and triggered false RPP collision predictions - docs/progress.md)
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0   # stock value; keeps paths at corridor centres
        inflation_radius: 0.30
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      # Planning footprint: circle r = 0.13 m = circumscribed radius of the true Burger outline (0.124 m)
      # + 6 mm. With the true polygon (inscribed radius 0.04 m) Smac cut wall ends to ~5 cm and the pivoting
      # robot could not follow (docs/progress.md). Local collision checking uses the true polygon.
      robot_radius: 0.13
      resolution: 0.025
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 6.0   # (project change) steep cost near walls -> planner keeps to corridor centres
        inflation_radius: 0.35
      always_send_full_costmap: True

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 5.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    # Baseline global planner: Smac 2D = cost-aware A* on the costmap (8-connected).
    # NavfnPlanner (Dijkstra) was tried first and failed on every route with turns in this maze:
    # "Failed to create a plan from potential when a legal potential was found" (results/trials_attempt1_navfn.csv,
    # docs/progress.md). Parameter names verified in the installed libnav2_smac_planner_2d.so.
    GridBased:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.10
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 3.0   # (project change)
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

behavior_server:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.0

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    enable_stamped_cmd_vel: false
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: False
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.22, 0.0, 2.0]
    min_velocity: [-0.15, 0.0, -2.0]   # reverse only for the BackUp recovery (RPP allow_reversing=false)
    max_accel: [1.0, 0.0, 3.0]
    max_decel: [-1.0, 0.0, -3.0]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
